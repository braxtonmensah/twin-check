name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies (hash-checked) and pytest
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Unit tests and must-fail controls
        run: python -m pytest -q tests

  vendored-code-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Recompute sha256 of the vendored metric function against the original
        run: python -I ci/check_vendored.py

  example:
    # Runs examples/workflow.yml's inputs through 'uses: ./' on the 50-row fixture.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        format: [fasta, csv]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read inputs from examples/workflow.yml
        id: ex
        run: |
          step='.jobs.twin-check.steps[] | select(.uses == "braxtonmensah/twin-check@v1")'
          test "$(yq "$step | .uses" examples/workflow.yml)" = "braxtonmensah/twin-check@v1"
          train=$(yq "$step | .with.train" examples/workflow.yml)
          test=$(yq "$step | .with.test" examples/workflow.yml)
          if [ "${{ matrix.format }}" = "csv" ]; then train="${train%.fasta}.csv"; test="${test%.fasta}.csv"; fi
          echo "train=$train" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"
      - name: twin-check (uses ./)
        id: tc
        uses: ./
        with:
          train: ${{ steps.ex.outputs.train }}
          test: ${{ steps.ex.outputs.test }}
          format: ${{ matrix.format }}
          column: ${{ matrix.format == 'csv' && 'sequence' || '' }}
      - name: Assert outputs and step summary
        run: |
          echo "twin=${{ steps.tc.outputs.twin_rate }} exact=${{ steps.tc.outputs.exact_rate }} n_test=${{ steps.tc.outputs.n_test }}"
          test "${{ steps.tc.outputs.twin_rate }}" = "40.00"
          test "${{ steps.tc.outputs.exact_rate }}" = "0.00"
          test "${{ steps.tc.outputs.n_test }}" = "50"
          test "${{ steps.tc.outputs.n_train }}" = "200"
          grep -q '| metric | value |' .twin-check/summary.md
          python3 -c "import json;b=json.load(open('.twin-check/badge.json'));assert b['schemaVersion']==1 and all(isinstance(b[k],str) for k in ('label','message','color')), b;print(b)"

  bad-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: : > empty.fasta
      - name: Empty input must fail, not report zero
        id: bad
        continue-on-error: true
        uses: ./
        with:
          train: empty.fasta
          test: tests/fixtures/example_test.fasta
      - name: Assert the step failed
        run: test "${{ steps.bad.outcome }}" = "failure"
