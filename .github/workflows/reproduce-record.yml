name: reproduce-record

# Downloads the public upstream split files behind Silicyte's published leakage record,
# checks every MD5, runs this action on them through 'uses: ./', and asserts the published
# values (https://silicyte.com/data/leakage-measurements.json) to two decimals.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dataset: [lrgb-peptides-func, lrgb-corrected-v1, amplify-positives, flip-meltome-mixed]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies for the download step (hash-checked)
        run: |
          python -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      - name: Download upstream files and check MD5s
        id: prep
        run: python -I ci/prepare.py "${{ matrix.dataset }}" "$RUNNER_TEMP/data"
      - name: twin-check (uses ./)
        id: tc
        uses: ./
        with:
          train: ${{ steps.prep.outputs.train }}
          test: ${{ steps.prep.outputs.test }}
          format: ${{ steps.prep.outputs.format }}
          column: ${{ steps.prep.outputs.format == 'csv' && 'sequence' || '' }}
          label: ${{ steps.prep.outputs.label }}
          badge-path: badges/${{ matrix.dataset }}.json
      - name: Assert against the published record
        run: >
          python -I ci/assert_record.py "${{ matrix.dataset }}"
          "${{ steps.tc.outputs.twin_rate }}" "${{ steps.tc.outputs.exact_rate }}"
          "${{ steps.tc.outputs.n_train }}" "${{ steps.tc.outputs.n_test }}"
      - name: fail-above control (must fail on LRGB at fail-above=1)
        if: matrix.dataset == 'lrgb-peptides-func'
        id: failrun
        continue-on-error: true
        uses: ./
        with:
          train: ${{ steps.prep.outputs.train }}
          test: ${{ steps.prep.outputs.test }}
          fail-above: '1'
          badge-path: ''
          record-path: ''
          summary-path: ''
      - name: Assert the fail-above run failed
        if: matrix.dataset == 'lrgb-peptides-func'
        run: |
          echo "fail-above outcome: ${{ steps.failrun.outcome }}"
          test "${{ steps.failrun.outcome }}" = "failure"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: badge-${{ matrix.dataset }}
          include-hidden-files: true
          path: |
            badges/${{ matrix.dataset }}.json
            .twin-check/record.json

  badges:
    needs: reproduce
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: art
      - name: Commit badges/<dataset>.json to the badges branch
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/b/badges"
          for d in art/badge-*; do
            name="${d#art/badge-}"
            cp "$d/badges/$name.json" "$RUNNER_TEMP/b/badges/$name.json"
            cp "$d/.twin-check/record.json" "$RUNNER_TEMP/b/badges/$name.record.json"
          done
          echo "$RUN_URL" > "$RUNNER_TEMP/b/badges/LAST_RUN.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch --depth=1 origin badges
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rf --quiet . || true
          fi
          git clean -fdxq -e art
          rm -rf badges && cp -r "$RUNNER_TEMP/b/badges" badges
          git add badges
          if git diff --cached --quiet; then echo "badges unchanged"; else
            git commit -q -m "badges from $RUN_URL"
            git push origin badges
          fi
          ls -la badges
      - name: README badge URLs return HTTP 200 from img.shields.io
        run: |
          set -e
          for name in lrgb-peptides-func amplify-positives flip-meltome-mixed; do
            want=$(python3 -c "import json;print(json.load(open('badges/$name.json'))['message'])")
            url="https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/${{ github.repository }}/badges/badges/$name.json"
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o badge.svg -w '%{http_code}' "$url&cacheSeconds=300&_r=${{ github.run_id }}$i")
              if [ "$code" = "200" ] && grep -q "$want" badge.svg; then ok=1; break; fi
              echo "attempt $i: HTTP $code, message '$want' not yet in SVG"; sleep 20
            done
            echo "$name: HTTP $code, badge shows $want"
            test "$ok" = "1"
          done
