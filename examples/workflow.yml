# Copy to .github/workflows/twin-check.yml in your repo and point train/test at your split.
name: twin-check
on: [push, pull_request]
jobs:
  twin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: braxtonmensah/twin-check@v1
        with:
          train: tests/fixtures/example_train.fasta
          test: tests/fixtures/example_test.fasta
